    <!-- Les deux polices du premier écran (titres, texte courant), demandées sans attendre la feuille. -->
    <link rel="preload" as="font" type="font/ttf" crossorigin href="../server/fonts/barlow-condensed-700.ttf" />
    <link rel="preload" as="font" type="font/ttf" crossorigin href="../server/fonts/outfit-400.ttf" />
    <!-- La coquille du premier affichage (#root ci-dessous) : sa feuille tient ici, sans attendre styles.css. -->
    <style>
      html,body{margin:0;background:#0c0d1b;color-scheme:dark}
      .boot{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
      .boot-top{box-sizing:border-box;display:flex;align-items:center;width:100%;max-width:1112px;height:52px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
      .boot-brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:700 14px/1 "Outfit",system-ui,sans-serif;letter-spacing:.2em;color:#fff9cb;text-decoration:none}
      .boot-brand svg{display:block}
      .boot-main{flex:1;display:flex;flex-direction:column;align-items:center;padding:28vh 16px 0}
      .boot-line{position:relative;width:120px;height:2px;overflow:hidden;border-radius:2px;background:rgba(229,221,255,.14)}
      .boot-line::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;background:#ffb2c6;animation:boot 1.1s ease-in-out infinite}
      @keyframes boot{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){.boot-line::after{animation:none;width:100%;opacity:.5}}
      @media (max-width:349px){.boot-name{display:none}}
      @media (min-width:900px){.boot-top{max-width:1144px;height:64px;padding:0 32px}}
    </style>
  </head>
  <body>
    <!-- Coquille statique : la marque et un trait d'attente dès le HTML, remplacés au montage de React. -->
    <div id="root"><div class="boot"><header class="boot-top"><a class="boot-brand" href="/" aria-label="Azerit"><svg width="18" height="21" viewBox="0 0 104 120" fill="none" aria-hidden="true"><path d="M52 8 L14 50 L37 102 Z" fill="#c9d67c" stroke="#c9d67c" stroke-width="9" stroke-linejoin="round"/><path d="M63 10 L92 42 L85 80 L47 112 Z" fill="#6fb2a8" stroke="#6fb2a8" stroke-width="9" stroke-linejoin="round"/></svg><span class="boot-name">AZERIT</span></a></header><main class="boot-main" aria-busy="true"><div class="boot-line"></div></main></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
