<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0d1b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Testyourskills · Maquette de l'image de partage 1080 × 1350</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow+Semi+Condensed:wght@700&family=Outfit:wght@500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="gta.css" />
    <style>
      /* Image de partage portrait 1080 × 1350 (inspiration §3.7), réduite pour
         tenir dans la fenêtre. Une seule composition SVG, comme le rendu serveur
         (resvg) : illustration en aplats superposés (perspective atmosphérique
         sans dégradé), la fiche au centre, qui apporte le seul dégradé. */
      body { display: grid; place-items: center; min-height: 100vh; padding: 16px; background: #05060d; }
      #art { width: 1080px; height: 1350px; transform-origin: top left; }
      #frame { overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px var(--lilac-faint); }
      p.pv { margin: 10px 0 0; text-align: center; }
    </style>
  </head>
  <body>
    <div>
      <div id="frame"><div id="art"></div></div>
      <p class="pv" id="scale"></p>
    </div>
    <script src="gta-card.js"></script>
    <script>
      const W = 1080, H = 1350;
      const palm = (x, y, k, fill, flip) => `<g transform="translate(${x} ${y}) scale(${flip ? -k : k} ${k})" fill="${fill}"><path d="${TYS.PALM}"/></g>`;
      function skyline(y, fill, seed, lights) {
        let s = "", x = 0, r = seed;
        const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
        while (x < W) {
          const w = 26 + rnd() * 50, h = 30 + rnd() * 110;
          s += `<rect x="${x.toFixed(1)}" y="${(y - h).toFixed(1)}" width="${(w + 1).toFixed(1)}" height="${(h + 2).toFixed(1)}" fill="${fill}"/>`;
          if (lights) for (let k = 0; k < h / 18 - 1; k++) for (let j = 0; j < w / 14 - 1; j++) if (rnd() > 0.55) s += `<rect x="${(x + 6 + j * 13).toFixed(1)}" y="${(y - h + 10 + k * 17).toFixed(1)}" width="4" height="5" fill="#ffc46b" fill-opacity="0.75"/>`;
          x += w;
        }
        return s;
      }
      function render() {
        const card = TYS.card(TYS.CARDS.samk).replace('<svg class="fiche"', '<svg x="259.5" y="150" width="561" height="810"');
        const HZ = 1000; // horizon
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
          <rect width="${W}" height="${H}" fill="#2d2a66"/>

          <circle cx="540" cy="760" r="400" fill="#e98a98"/>
          ${skyline(HZ, "#463b84", 7, false)}
          ${palm(-60, 560, 3.4, "#241f55")}
          ${palm(1150, 640, 2.8, "#241f55", true)}
          ${skyline(HZ, "#1d1946", 31, true)}
          <rect y="${HZ}" width="${W}" height="${H - HZ}" fill="#121130"/>
          <text x="540" y="108" text-anchor="middle" font-family="Outfit" font-weight="600" font-size="50" letter-spacing="17" fill="#fff9cb" fill-opacity="0.6">AVIS DE RECHERCHE</text>
          <rect x="259.5" y="150" width="561" height="810" rx="25" fill="#000" fill-opacity="0.001"/>
          ${card}
          <text x="540" y="1100" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="104" fill="#fff9cb">OISEAU DE NUIT</text>
          <text x="540" y="1166" text-anchor="middle" font-family="Outfit" font-weight="500" font-size="40" fill="#ffb2c6">Les meilleurs coups partent à 3 h du matin</text>
          <g transform="translate(386 1240) scale(0.27)"><path d="M52 8 L14 50 L37 102 Z" fill="#c9d67c" stroke="#c9d67c" stroke-width="9" stroke-linejoin="round"/><path d="M63 10 L92 42 L85 80 L47 112 Z" fill="#6fb2a8" stroke="#6fb2a8" stroke-width="9" stroke-linejoin="round"/></g>
          <text x="430" y="1268" font-family="Outfit" font-weight="600" font-size="28" letter-spacing="5.6" fill="#e5ddff" fill-opacity="0.8">SKILLS.AZERIT.TECH</text>
        </svg>`;
        document.getElementById("art").innerHTML = svg;
        const s = Math.min(1, (innerWidth - 32) / W, (innerHeight - 60) / H);
        const art = document.getElementById("art");
        art.style.transform = `scale(${s})`;
        const fr = document.getElementById("frame");
        fr.style.width = `${W * s}px`;
        fr.style.height = `${H * s}px`;
        document.getElementById("scale").textContent = `1080 × 1350 affiché à ${Math.round(s * 100)} %`;
      }
      TYS.ready().then(() => { render(); addEventListener("resize", render); document.documentElement.dataset.ready = "1"; });
    </script>
  </body>
</html>
