<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Testyourskills · Cadres téléphone 390 × 844</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="gta.css" />
    <style>
      /* Chaque écran dans un iframe de 390 × 844 (même origine), réduit pour tenir
         dans la fenêtre si besoin. ?s=accueil n'affiche qu'un écran ; ?y=900 fait
         défiler l'écran affiché ; ?h=2400 allonge le cadre pour voir la page entière. */
      body { padding: 16px; background: #05060d; }
      .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
      .phone { display: grid; gap: 8px; justify-items: center; }
      .phone p { margin: 0; font: 600 12px/1 var(--f-text); color: var(--lilac-dim); letter-spacing: .12em; text-transform: uppercase; }
      .screen { width: 390px; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 6px #1a1b2c; transform-origin: top center; }
      iframe { display: block; width: 390px; border: 0; background: var(--ink-0); }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <script>
      const ALL = [["fiches", "gta.html"], ["accueil", "gta-accueil.html"], ["partage", "gta-partage.html"], ["carton", "gta-carton.html"], ["image", "gta-image.html"]];
      const q = new URLSearchParams(location.search);
      const only = q.get("s");
      const h = Number(q.get("h") || 844);
      const y = Number(q.get("y") || 0);
      const list = only ? ALL.filter(([k]) => k === only) : ALL;
      document.getElementById("row").innerHTML = list.map(([k, src]) => `<div class="phone"><p>${k} · 390 × ${h}</p><div class="screen" style="height:${h}px"><iframe src="${src}" style="height:${h}px" title="${k}"></iframe></div></div>`).join("");
      // Réduction pour tenir dans la fenêtre (un seul écran affiché)
      if (only) {
        const s = Math.min(1, (innerHeight - 50) / h);
        document.querySelector(".screen").style.transform = `scale(${s})`;
        document.querySelector(".phone").style.height = `${h * s + 30}px`;
      }
      if (y) document.querySelectorAll("iframe").forEach((f) => f.addEventListener("load", () => [600, 1200, 2000].forEach((t) => setTimeout(() => f.contentWindow.scrollTo(0, y), t))));
    </script>
  </body>
</html>
